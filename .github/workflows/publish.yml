name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Publicar paquete en PyPI
    runs-on: ubuntu-latest

    permissions:
      id-token: trusted-publishing  # Permite autenticación segura con PyPI (Trusted Publishers)

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Instalar herramientas de compilación
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: 🏗️ Compilar distribución (sdist y wheel)
        run: python -m build

      - name: 🚀 Publicar en PyPI
        uses: pypa/gh-action-pypi-publish@release/v1