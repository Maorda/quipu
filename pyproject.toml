[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tukuyrikuq"  # <-- Mantenemos tu nombre oficial de PyPI intacto
version = "0.1.1"
description = "Librería agnóstica de orquestación en memoria para ingesta legal y transporte de datos"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

# Configuración clave: setuptools buscará dentro de 'src' e incluirá la carpeta 'quipu'
[tool.setuptools.packages.find]
where = ["src"]
include = ["quipu*"]
